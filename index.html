<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5e9d0">
  <title>Chase Doelling</title>
  <meta name="description" content="Chase Doelling, Co-Founder and GTM Principal at Sandcastle Labs in Denver. Fifteen years of go-to-market across JumpCloud, Cloud Elements, CA Technologies and Rally Software, plus side projects.">
  <meta property="og:title" content="Chase Doelling">
  <meta property="og:description" content="Co-Founder and GTM Principal at Sandcastle Labs. Denver, Colorado.">
  <meta property="og:image" content="https://chasedoelling.com/assets/img/grey-denver.jpg">
  <meta property="og:url" content="https://chasedoelling.com/">
  <link rel="icon" href="assets/img/cd-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght,SOFT,WONK@9..144,800,0,1;9..144,900,0,1&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5e9d0;--ink:#153d3e;--orange:#e7532b;--yellow:#edc447;--blue:#27787a;--line:#153d3e;--rail:176px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Mono',monospace}body:before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}a{color:inherit}img{display:block;max-width:100%}::selection{background:var(--orange);color:var(--paper)}
    .rail{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:40;background:var(--paper);border-right:3px solid var(--ink);display:flex;flex-direction:column;padding:20px 12px}.brand{font:900 43px/.83 'Fraunces',serif;letter-spacing:-.07em;text-decoration:none;transform:rotate(-4deg);display:block;margin:8px 0 40px}.brand span{color:var(--orange)}.rail-stamp{display:block;color:var(--orange);border:2px solid var(--orange);font-size:9px;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:8px 2px;transform:rotate(4deg);margin-bottom:18px}.rail nav{display:flex;flex-direction:column;gap:7px}.rail nav a{text-decoration:none;text-transform:uppercase;font-size:10px;font-weight:500;letter-spacing:.02em;border:2px solid transparent;padding:10px 8px;line-height:1.2}.rail nav a:hover,.rail nav a.active{background:var(--yellow);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}.rail-bottom{margin-top:auto;font-size:9px;line-height:1.7;text-transform:uppercase;border-top:2px solid var(--ink);padding-top:10px}
    main{margin-left:var(--rail);min-width:0}.hero{height:100svh;min-height:0;position:relative;overflow:hidden;background:var(--orange);color:var(--paper);border-bottom:8px solid var(--ink)}.hero-photo,.hero-photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-photo{background-size:cover;background-position:center;filter:grayscale(1) contrast(1.25)}.hero-photo:after{content:"";position:absolute;inset:0;background:var(--orange);mix-blend-mode:multiply;opacity:.72}.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(21,61,62,.83),rgba(21,61,62,.1) 80%),repeating-radial-gradient(circle at 0 0,transparent 0 4px,rgba(21,61,62,.18) 4px 6px);background-size:auto,10px 10px}.hero-content{position:absolute;z-index:3;left:clamp(26px,5vw,90px);right:4vw;bottom:9vh}.hero-kicker{display:inline-block;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:10px 17px;transform:rotate(-3deg);font-size:clamp(14px,1.5vw,22px);font-weight:500;text-transform:uppercase}.hero h1{font:900 clamp(88px,14vw,225px)/.78 'Fraunces',serif;letter-spacing:-.095em;text-transform:uppercase;margin:32px 0 15px;text-shadow:7px 7px 0 var(--orange);max-width:1300px}.hero-line{font:900 clamp(22px,3.4vw,50px)/1 'Archivo Black',sans-serif;text-transform:uppercase;margin:25px 0 0;max-width:900px}.hero-foot{display:flex;gap:20px;align-items:center;margin-top:34px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.hero-foot span{border-top:2px solid var(--paper);padding-top:9px}.hero-side{position:absolute;z-index:3;right:25px;bottom:28px;font-size:10px;writing-mode:vertical-rl;text-transform:uppercase;letter-spacing:.15em}
    .section{position:relative;padding:clamp(70px,8vw,135px) clamp(25px,5vw,85px);border-bottom:6px solid var(--ink);scroll-margin-top:0}.section:nth-of-type(even){background:#f0dfbb}.section-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:55px}.section-num{background:var(--orange);color:var(--paper);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:9px 11px;font:900 17px 'Archivo Black',sans-serif;transform:rotate(-8deg)}.section h2{font:900 clamp(67px,10.7vw,165px)/.8 'Fraunces',serif;text-transform:uppercase;letter-spacing:-.07em;margin:0;overflow-wrap:anywhere}.section-sub{font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin-top:15px;border-top:2px solid var(--ink);padding-top:10px}
    .about-grid{display:grid;grid-template-columns:minmax(230px,.68fr) 1.32fr;gap:clamp(25px,5vw,80px);align-items:start}.portrait-frame{background:var(--yellow);padding:12px 12px 50px;border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink);transform:rotate(-3deg);position:relative}.portrait-frame img,.portrait-frame video{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:20% 85%}.portrait-frame img{filter:sepia(.4) contrast(1.1)}.portrait-frame:after{content:"COLORADO NATIVE / CHASE";position:absolute;bottom:16px;left:15px;font-size:10px;font-weight:500}.about-copy p{font-size:clamp(15px,1.35vw,20px);line-height:1.6;margin:0 0 23px}.about-copy p:first-child{font:800 clamp(23px,2.2vw,35px)/1.25 'Fraunces',serif}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:75px}.stat{background:var(--yellow);border:3px solid var(--ink);padding:20px 14px;box-shadow:5px 5px 0 var(--ink);min-height:155px}.stat:nth-child(even){background:var(--orange);color:var(--paper);transform:rotate(2deg)}.stat:nth-child(3){transform:rotate(-2deg)}.stat strong{font:900 clamp(46px,5vw,78px)/1 'Fraunces',serif;display:block;letter-spacing:-.08em}.stat span{display:block;margin-top:9px;font-size:10px;text-transform:uppercase;line-height:1.4}
    .company{display:grid;grid-template-columns:180px 1fr;gap:30px;border-top:3px solid var(--ink);padding:35px 0}.company-year{font:900 18px 'Archivo Black',sans-serif;color:var(--orange)}.company h3{font:900 clamp(38px,5vw,75px)/.95 'Fraunces',serif;text-transform:uppercase;letter-spacing:-.05em;margin:0 0 15px}.company-note{font-weight:500;font-size:12px;line-height:1.5;background:var(--yellow);display:inline-block;padding:9px 12px;border:2px solid var(--ink);margin:0 0 18px;transform:rotate(-1deg)}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.role{background:var(--paper);border:2px solid var(--ink);padding:17px;box-shadow:4px 4px 0 var(--ink)}.role h4{font:900 19px/1.13 'Fraunces',serif;margin:0 0 9px}.role time{display:block;color:#a83218;font-size:10px;text-transform:uppercase;margin-bottom:13px;font-weight:500}.role p{font-size:11px;line-height:1.6;margin:0}.highlights{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.highlight{background:var(--ink);color:var(--paper);padding:8px 10px;font-size:9px;text-transform:uppercase;transform:rotate(-2deg)}.highlight:nth-child(even){background:var(--orange);transform:rotate(2deg)}
    .project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.project{background:var(--paper);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);text-decoration:none;display:flex;flex-direction:column;transition:transform .2s}.project:hover{transform:translate(-3px,-5px)}.project:nth-child(2){transform:rotate(2deg)}.project:nth-child(2):hover{transform:rotate(2deg) translate(-3px,-5px)}.project-image{aspect-ratio:4/3;overflow:hidden;border-bottom:3px solid var(--ink);position:relative;background:var(--blue)}.project-image img{width:100%;height:100%;object-fit:cover;filter:saturate(.65) contrast(1.05)}.project-image:after{content:"↗";position:absolute;right:10px;top:10px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);width:35px;height:35px;display:grid;place-items:center;font-size:23px}.project-body{padding:22px;display:flex;flex-direction:column;flex:1}.project-kind{font-size:9px;text-transform:uppercase;color:#a83218;font-weight:500;letter-spacing:.05em}.project h3{font:900 clamp(25px,3vw,42px)/1 'Fraunces',serif;letter-spacing:-.045em;margin:15px 0}.project p{font-size:11px;line-height:1.65;margin:0 0 20px}.project-cta{margin-top:auto;border-top:2px solid var(--ink);padding-top:10px;font:500 10px 'DM Mono',monospace;text-transform:uppercase}
    .graveyard{background:var(--ink)!important;color:var(--paper)}.graveyard .section-num{background:var(--yellow);color:var(--ink)}.grave-intro{max-width:650px;font-size:13px;line-height:1.6;margin:-20px 0 40px}.grave-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grave{border:3px solid var(--paper);padding:18px;text-align:center;background:#17494a;clip-path:polygon(0 9%,12% 0,88% 0,100% 9%,100% 100%,0 100%);padding-top:45px}.grave:nth-child(2){background:#22595a}.grave-rip{font:900 37px 'Fraunces',serif;color:var(--yellow);letter-spacing:.1em}.grave img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(1) sepia(.3);margin:17px 0;border:2px solid var(--paper)}.grave h3{font:900 30px/1 'Fraunces',serif;text-transform:uppercase;letter-spacing:-.04em;margin:17px 0}.grave time{color:var(--yellow);font-size:10px}.grave p{text-align:left;font-size:11px;line-height:1.6;margin:20px 0}.grave-gallery{display:flex;gap:6px}.grave-gallery img{width:calc(50% - 3px);aspect-ratio:1.5;margin:0}
    .century-card{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);background:var(--yellow);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink)}.century-pics{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;border-right:3px solid var(--ink);background:var(--ink);gap:3px}.century-pics img{width:100%;height:100%;aspect-ratio:1;object-fit:cover;filter:saturate(.8) sepia(.15)}.century-body{padding:22px;display:flex;flex-direction:column}.century-body h3{font:900 clamp(25px,3vw,42px)/1 'Fraunces',serif;letter-spacing:-.045em;margin:15px 0}.century-body>p{font-size:11px;line-height:1.65;margin:0 0 18px}.century-meters{display:grid;gap:6px;margin-bottom:18px}.century-meters .meter{margin:0 0 8px}.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:10px;text-transform:uppercase;font-weight:500}.progress-label b{color:#a83218}.meter{height:16px;border:2px solid var(--ink);background:var(--paper);padding:2px}.meter span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--orange) 0 9px,var(--ink) 9px 11px)}details{border-top:2px solid var(--ink);padding-top:10px;margin-top:auto}summary{cursor:pointer;font:500 10px 'DM Mono',monospace;text-transform:uppercase}summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.century-list{list-style:none;margin:14px 0 0;padding:0;columns:2;column-gap:22px;font-size:10.5px;line-height:1.4}.century-list li{break-inside:avoid;display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(21,61,62,.35)}.century-list li span:before{content:"✓ ";color:#a83218}.century-list li.todo span:before{content:"○ "}.century-list time{color:#a83218;text-align:right;white-space:nowrap}
    .contact{background:var(--orange)!important;color:var(--paper);min-height:70vh;display:flex;flex-direction:column;justify-content:center}.contact-kicker{background:var(--yellow);color:var(--ink);align-self:start;transform:rotate(-3deg);padding:10px;border:2px solid var(--ink);font-size:11px;text-transform:uppercase}.contact h2{font-size:clamp(85px,14vw,205px);text-shadow:8px 8px 0 var(--ink);margin:35px 0}.contact-links{display:flex;flex-wrap:wrap;gap:15px}.contact-links a{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:17px 22px;font:900 15px 'Archivo Black',sans-serif;text-decoration:none;text-transform:uppercase;transform:rotate(-2deg)}.contact-links a:nth-child(2){background:var(--yellow);transform:rotate(2deg)}.contact-links a:hover{transform:translate(-3px,-3px)}.contact-foot{display:flex;justify-content:space-between;gap:20px;border-top:2px solid var(--paper);padding-top:18px;margin-top:70px;font-size:10px;text-transform:uppercase}
    @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.century-card{grid-template-columns:1fr}.century-pics{border-right:0;border-bottom:3px solid var(--ink)}.project-grid,.grave-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:759px){:root{--rail:0px}.rail{inset:0 0 auto;width:100%;height:58px;padding:0 10px;flex-direction:row;align-items:center;gap:8px;border-right:0;border-bottom:3px solid var(--ink)}.brand{font-size:29px;transform:none;margin:0;flex:none}.rail-stamp,.rail-bottom{display:none}.rail nav{display:flex;flex-direction:row;gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.rail nav::-webkit-scrollbar{display:none}.rail nav a{font-size:9px;padding:9px 7px;flex:none}.rail nav a.active{box-shadow:none;transform:none}main{margin-left:0}.hero{min-height:0}.hero-content{left:23px;right:23px;bottom:10vh}.hero h1{font-size:clamp(60px,18vw,145px)}.hero-line{font-size:clamp(20px,6vw,38px)}.hero-side{display:none}.section{padding:78px 23px;scroll-margin-top:58px}.section h2{font-size:clamp(38px,11.5vw,110px);overflow-wrap:normal}.contact h2{overflow-wrap:anywhere}.section-head{gap:10px}.section-num{font-size:12px}.about-grid,.company{grid-template-columns:1fr}.portrait-frame{max-width:390px;margin-bottom:20px}.company{gap:15px}.roles{grid-template-columns:1fr}.project-grid,.grave-grid{grid-template-columns:1fr}.century-list{columns:1}.hero-foot{flex-direction:column;align-items:flex-start;gap:10px}.contact h2{font-size:clamp(80px,19vw,145px)}.contact-foot{flex-direction:column}}
    @media(max-width:420px){.stats{gap:8px}.stat{padding:12px;min-height:125px}.stat strong{font-size:48px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <script src="content.js"></script>
  <div id="app"></div>
  <script>
    (()=>{
      const s=window.SITE, asset=p=>p, esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const photo=(src,alt)=>`<img src="${asset(src)}" alt="${esc(alt)}" loading="lazy">`;
      const heading=(title,n,sub)=>`<div class="section-head"><span class="section-num">${String(n).padStart(2,'0')}</span><div><h2>${title}</h2><div class="section-sub">${sub}</div></div></div>`;
      const centuryCard=()=>{const c=s.century;if(!c)return'';const pics=c.items.filter(x=>x.img).slice(0,6);
        return `<article class="century-card" id="century"><div class="century-pics">${pics.map(x=>photo(x.img,`${x.title}, ${x.when}`)).join('')}</div><div class="century-body"><span class="project-kind">${esc(c.kind)} / ${esc(c.year)}</span><h3>${esc(c.name)}</h3><p>${esc(c.intro)}</p><div class="century-meters">${c.progress.map(p=>`<div class="progress-label"><span>${esc(p.label)}</span><b>${esc(p.pct)}%</b></div><div class="meter" role="progressbar" aria-label="${esc(p.label)}" aria-valuenow="${esc(p.pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.max(0,Math.min(100,Number(p.pct)))}%"></span></div>`).join('')}</div><details><summary>See all ${c.items.length} items</summary><ul class="century-list">${c.items.map(x=>`<li${/not yet/i.test(x.when)?' class="todo"':''}><span>${esc(x.title)}</span><time>${esc(x.when)}</time></li>`).join('')}</ul></details></div></article>`};
      const nav=s.nav.map((n,i)=>`<a href="#${esc(n.id)}" data-nav="${esc(n.id)}">${String(i+1).padStart(2,'0')} ${esc(n.label)}</a>`).join('');
      const heroMedia=s.hero.video?`<div class="hero-photo"><video autoplay muted loop playsinline poster="${asset(s.hero.poster)}"><source src="${asset(s.hero.video)}"></video></div>`:`<div class="hero-photo" role="img" aria-label="Denver cityscape" style="background-image:url('${asset(s.hero.poster)}')"></div>`;
      document.getElementById('app').innerHTML=`
        <aside class="rail"><a class="brand" href="#top" aria-label="Chase Doelling, back to top">CD<span>!</span></a><span class="rail-stamp">Live from<br>Colorado</span><nav aria-label="Sections">${nav}</nav><div class="rail-bottom">${esc(s.name)}<br>${esc(s.location)}<br>Personal site / 2026</div></aside>
        <main><header class="hero" id="top">${heroMedia}<div class="hero-content"><span class="hero-kicker">${esc(s.hero.kicker)}</span><h1>${esc(s.name).replace(' ','<br>')}</h1><p class="hero-line">${esc(s.hero.line)}</p><div class="hero-foot"><span>${esc(s.headline)}</span><span>${esc(s.location)}</span></div></div><span class="hero-side">One night only / all year long</span></header>
        <section id="about" class="section">${heading('About',1,'The person behind the poster')}<div class="about-grid"><div class="portrait-frame">${s.aboutVideo?`<video autoplay muted loop playsinline preload="metadata" poster="${asset(s.aboutVideo.poster)}" aria-label="${esc(s.name)} sitting by a river at sunset"><source src="${asset(s.aboutVideo.src)}" type="video/mp4"></video>`:photo(s.portrait,`Portrait of ${s.name}`)}</div><div class="about-copy">${s.about.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div><div class="stats">${s.stats.map(x=>`<div class="stat"><strong>${esc(x.value)}</strong><span>${esc(x.label)}</span></div>`).join('')}</div></section>
        <section id="experience" class="section">${heading('Experience',2,'The long running set list')}${s.experience.map(c=>`<article class="company"><div class="company-year">${esc(c.years)}</div><div><h3>${esc(c.company)}</h3>${c.note?`<p class="company-note">${esc(c.note)}</p>`:''}<div class="roles">${c.roles.map(r=>`<div class="role"><h4>${esc(r.title)}</h4><time>${esc(r.dates)}</time><p>${esc(r.summary)}</p></div>`).join('')}</div>${c.highlights?.length?`<div class="highlights" aria-label="Highlights">${c.highlights.map(h=>`<span class="highlight">${esc(h)}</span>`).join('')}</div>`:''}</div></article>`).join('')}</section>
        <section id="projects" class="section">${heading('Projects',3,'Featured attractions')}<div class="project-grid">${s.projects.map(p=>`<a class="project" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer"><div class="project-image">${photo(p.image,`Screenshot of ${p.name}`)}</div><div class="project-body"><span class="project-kind">${esc(p.kind)} / ${esc(p.year)}</span><h3>${esc(p.name)}</h3><p>${esc(p.blurb)}</p><span class="project-cta">Take a look ↗</span></div></a>`).join('')}</div>${centuryCard()}</section>
        <section id="graveyard" class="section graveyard">${heading('Killed',4,'In loving memory of lessons learned')}<p class="grave-intro">A few projects that had their moment. Raise a glass, then keep building.</p><div class="grave-grid">${s.graveyard.map(g=>`<article class="grave"><div class="grave-rip">R.I.P.</div>${photo(g.image,`Archive image for ${g.name}`)}<h3>${esc(g.name)}</h3><time>${esc(g.born)} — ${esc(g.died)}</time><p>${esc(g.epitaph)}</p>${g.gallery?.length?`<div class="grave-gallery">${g.gallery.map((src,i)=>photo(src,`${g.name} archive photo ${i+2}`)).join('')}</div>`:''}</article>`).join('')}</div></section>
        
        <section id="contact" class="section contact"><span class="contact-kicker">${String(s.nav.length).padStart(2,'0')} / Encore</span><h2>Say hello.</h2><div class="contact-links"><a href="mailto:${esc(s.email)}">Email Chase ↗</a><a href="${esc(s.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a></div><div class="contact-foot"><span>${esc(s.email)}</span><span>${esc(s.name)} / ${esc(s.location)}</span></div></section></main>`;
      const links=[...document.querySelectorAll('[data-nav]')],sections=s.nav.map(n=>document.getElementById(n.id));
      const update=()=>{let current=sections[0]?.id;const cutoff=window.innerHeight*.4;sections.forEach(el=>{if(el.getBoundingClientRect().top<=cutoff)current=el.id});links.forEach(a=>{const active=a.dataset.nav===current;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})};
      window.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update);update();
    })();
  </script>
</body>
</html>
